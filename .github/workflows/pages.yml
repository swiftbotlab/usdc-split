# Builds the app from this repo (the source synced unchanged from the Arc Studio workspace, session "split") and publishes
# it to GitHub Pages (https://swiftbotlab.github.io/usdc-split/) with Studio's bun.lock (frozen). The Studio app turn hit the daily
# budget before its own build, so GitHub Actions runs the Vite build.
# GitHub Pages can't send X-Frame-Options / frame-ancestors; src/main.tsx refuses to run inside foreign frames instead.
name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies (lockfile)
        run: bun install --frozen-lockfile
      - name: Build
        run: ./node_modules/.bin/vite build --base=./
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
